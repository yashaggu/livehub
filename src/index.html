<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Live Lite</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.3px; }
    button {
      background: #222;
      color: #fff;
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:active { background: #333; }
    #player-wrap {
      display: none;
      margin-bottom: 16px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #262626;
    }
    .aspect {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
    }
    .aspect iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #181818;
      font-size: 0.85rem;
    }
    .channel-list { display: flex; flex-direction: column; gap: 8px; }
    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181818;
      border: 1px solid #262626;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .card:active { background: #242424; }
    .name { font-weight: 500; font-size: 0.95rem; }
    .sub { font-size: 0.78rem; color: #999; margin-top: 3px; }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 99px;
      background: #222;
      color: #888;
      white-space: nowrap;
    }
    .badge.live { background: rgba(239, 68, 68, 0.18); color: #f87171; }
    .badge.ready { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
  </style>
</head>
<body>
  <header>
    <h1>Live Streams</h1>
    <button id="refresh-btn" onclick="checkAllLive()">Refresh</button>
  </header>

  <div id="player-wrap">
    <div class="aspect">
      <div id="yt-player"></div>
    </div>
    <div class="player-bar">
      <span id="now-playing">Loading stream...</span>
      <button onclick="closePlayer()">Close</button>
    </div>
  </div>

  <div class="channel-list" id="list"></div>

  <script>
    // 1. OPTIONAL: Add your YouTube Data API v3 key for dynamic live checks
    const API_KEY = ""; 

    // 2. CONFIGURE YOUR FAVORITE CHANNELS HERE
    const CHANNELS = [
      {
        name: "NASA Live (24/7)",
        staticVideoId: "M3HKLzjvKPc" //M3HKLzjvKPc
      },
      {
        name: "Lofi Girl (24/7)",
        staticVideoId: "4t4AQ15yj1M"
      },
      {
        name: "Example Dynamic Channel",
        channelId: "UCxxxxxxxxxxxxxxxxxxxxxx" // Requires API_KEY above to auto-detect live video
      }
    ];

    let state = CHANNELS.map(ch => ({
      ...ch,
      videoId: ch.staticVideoId || null,
      status: ch.staticVideoId ? "24/7" : "Idle",
      title: ch.staticVideoId ? "Tap to watch immediately" : "Tap Refresh to check"
    }));

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      state.forEach((ch, idx) => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => playChannel(idx);

        const badgeClass = ch.status === "LIVE" ? "live" : (ch.status === "24/7" ? "ready" : "");
        card.innerHTML = `
          <div>
            <div class="name">${ch.name}</div>
            <div class="sub">${ch.title}</div>
          </div>
          <span class="badge ${badgeClass}">${ch.status}</span>
        `;
        list.appendChild(card);
      });
    }

    // Low-quota check: swaps UC -> UU to read uploads playlist (1 unit) + videos.list (1 unit)
    async function checkAllLive() {
      if (!API_KEY) {
        alert("Add your YouTube Data API key in index.html to auto-check dynamic channels.");
        return;
      }
      const btn = document.getElementById("refresh-btn");
      btn.textContent = "Checking...";
      btn.disabled = true;

      for (let i = 0; i < state.length; i++) {
        const ch = state[i];
        if (ch.staticVideoId || !ch.channelId) continue;

        try {
          const uploadsId = ch.channelId.replace(/^UC/, "UU");
          const plRes = await fetch(
            `https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=4&playlistId=${uploadsId}&key=${API_KEY}`
          );
          const plData = await plRes.json();
          const ids = (plData.items || []).map(item => item.contentDetails.videoId).join(",");

          if (!ids) {
            ch.status = "Offline";
            ch.title = "No recent uploads";
            continue;
          }

          const vidRes = await fetch(
            `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${ids}&key=${API_KEY}`
          );
          const vidData = await vidRes.json();
          const liveVid = (vidData.items || []).find(v => v.snippet.liveBroadcastContent === "live");

          if (liveVid) {
            ch.videoId = liveVid.id;
            ch.status = "LIVE";
            ch.title = liveVid.snippet.title;
          } else {
            ch.videoId = null;
            ch.status = "Offline";
            ch.title = "Not streaming right now";
          }
        } catch (err) {
          ch.status = "Error";
          ch.title = "Network error—tap Refresh to retry";
        }
      }

      render();
      btn.textContent = "Refresh";
      btn.disabled = false;
    }

    function playChannel(idx) {
      const ch = state[idx];
      if (!ch.videoId) {
        alert("No active live stream found for this channel. Tap Refresh first.");
        return;
      }
      const wrap = document.getElementById("player-wrap");
      const container = document.getElementById("yt-player");
      document.getElementById("now-playing").textContent = ch.name;
      wrap.style.display = "block";

      // Load minimal iframe only on tap; mute=1 ensures reliable mobile autoplay
      container.innerHTML = `
        <iframe
          src="https://www.youtube.com/embed/${ch.videoId}?autoplay=1&mute=1&playsinline=1&rel=0"
          allow="autoplay; encrypted-media; fullscreen"
          allowfullscreen>
        </iframe>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closePlayer() {
      document.getElementById("yt-player").innerHTML = "";
      document.getElementById("player-wrap").style.display = "none";
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    render();
    if (API_KEY) checkAllLive();
  </script>
</body>
</html>
